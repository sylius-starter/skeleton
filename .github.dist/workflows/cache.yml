# Pushes the Docker build cache to the GitHub Container Registry, so the CI
# (and your teammates) do not rebuild the images from scratch.
name: Docker cache

"on":
    push:
        branches: ["main"]
    workflow_dispatch: ~

permissions:
    contents: read
    packages: write

jobs:
    push:
        name: Push the build cache
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: docker/setup-buildx-action@v4

            - name: Log in to the registry
              run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  coverage: none
                  tools: composer, castor

            - name: Push the build cache
              run: castor docker:push
