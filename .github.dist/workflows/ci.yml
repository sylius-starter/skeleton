name: CI

"on":
    push:
        branches: ["main"]
    pull_request:
        paths-ignore:
            - "*.md"
    schedule:
        - cron: "0 3 * * MON"
    workflow_dispatch: ~

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    packages: read

env:
    # Fix for symfony/console color detection. We know GitHub Actions can handle it.
    ANSICON: 1

jobs:
    qa:
        name: Quality checks
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v6

            - uses: docker/setup-buildx-action@v4

            # The build cache pushed by cache.yml (see "registry" in castor.php)
            - name: Log in to the registry
              run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  coverage: none
                  tools: composer, castor

            - name: Build the infrastructure
              run: castor build

            - name: Install the dependencies
              run: castor app:install

            - name: Security audit
              run: castor qa:audit

            - name: Linters
              run: castor qa:lint

            - name: Coding standards
              run: castor qa:cs

            - name: PHPStan
              run: castor qa:phpstan

            - name: PHPUnit
              run: castor qa:phpunit
